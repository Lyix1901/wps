name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile ARM64 Dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -shared \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework AVFoundation \
            -o WpsShotAssist.dylib \
            WpsShotAssist/src/Tweak.m

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WpsShotAssist.dylib
          path: WpsShotAssist.dylib
